name: worldline-production

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api: &api
  build:
    context: .
    target: api
  image: worldline-api:local
  restart: unless-stopped
  environment:
    DJANGO_SETTINGS_MODULE: config.production
    DJANGO_DEBUG: "false"
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a unique production secret}
    APP_DOMAIN: ${APP_DOMAIN:?Set the public hostname}
    POSTGRES_DB: ${POSTGRES_DB:-worldline}
    POSTGRES_USER: ${POSTGRES_USER:-worldline}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password}
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    CELERY_BROKER_URL: redis://redis:6379/0
    CACHE_URL: redis://redis:6379/1
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging: *logging

services:
  db:
    image: postgres:17.9
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-worldline}
      POSTGRES_USER: ${POSTGRES_USER:-worldline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
  api:
    <<: *api
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/health/',headers={'Host':os.environ['APP_DOMAIN'],'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
  worker:
    <<: *api
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
  beat:
    <<: *api
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/state/celerybeat-schedule", "--pidfile=/state/celerybeat.pid"]
    volumes:
      - beat_data:/state
  web:
    build:
      context: .
      target: web
    image: worldline-web:local
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set the public hostname}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

volumes:
  postgres_data:
  redis_data:
  beat_data:
  caddy_data:
  caddy_config:
